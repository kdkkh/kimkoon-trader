<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="desk-token" content="__DESK_TOKEN__">
<title>뉴스</title>
<link rel="stylesheet" href="/static/common.css">
<link rel="stylesheet" href="/static/panes.css">
<link rel="stylesheet" href="/tabs/news/view.css">
<script src="/static/common.js"></script>
<script src="/static/panes.js"></script>
</head>
<body class="paned">
<nav id="subnav"><span class="right" id="topnote"></span></nav>
<div id="panes">
  <div class="grid" id="p-query">
    <section class="card">
      <h3>뉴스 제목 조회 <span class="meta">내 한투 키(실전 · 조회만) · 단추를 눌렀을 때만</span></h3>
      <div class="body">
        <div class="setgrid">
          <div class="k">종목</div><div><input type="text" id="q-code" placeholder="6자리 — 비우면 전체"></div>
          <div class="k">건수</div><div><input type="number" id="q-n" value="40" min="1" max="400"></div>
          <div class="k">키</div><div id="q-key"></div>
        </div>
        <div class="row" style="margin-top:10px"><button class="btn blue" id="q-go">뉴스 제목 조회</button><span class="g msg" id="q-msg"></span></div>
        <div class="note" id="q-note"></div>
      </div>
    </section>
    <section class="card">
      <h3>최근 뉴스 제목 <span class="meta" id="q-meta"></span></h3>
      <div class="scroll"><table><thead><tr><th class="l">기사 시각</th><th class="l">공급사</th><th class="l">종목</th><th class="l">제목</th></tr></thead>
        <tbody id="q-rows"></tbody></table></div>
      <div class="body srcline" id="q-src"></div>
    </section>
  </div>
</div>
<script src="/tabs/news/view.js"></script>
</body>
</html>
