# 특정 상황 판단 견본 — 실행기 종목에 새 뉴스 제목이 붙었을 때, 그 제목이 '회사 가치에 직접 닿는 새 사건'인지 점수로 매긴다.
# 기본 쓰임은 알림만. 점수로 무엇을 할지(알림 · 거르기 · 모의 진입 신호)는 쓰는 사람이 정한다.
# 뉴스 제목은 judge.yaml send.news_titles 를 켜야 보낸다(기본 꺼짐 — 꺼져 있으면 이 판단은 묻지 않고 이유만 기록).
# 쓰는 법: event_watch.yaml 로 복사해 고친다.
id: event_watch
enabled: true
mode: paper_only
when:
  - {on: new_news, codes: runner, min_gap_s: 60}   # 실행기 종목에 새 제목이 보였을 때만, 같은 종목은 60초에 한 번까지
inputs:
  - {kind: news_titles, codes: trigger, last: 5}   # 새 제목이 붙은 그 종목(방아쇠 종목)의 최근 제목
  - {kind: bars, codes: trigger, last: 60, form: derived}
question: |
  위 뉴스 제목이 실적 · 수주 · 자사주 · 대규모 계약처럼 회사 가치에 직접 닿는 새 사건인지, 그리고 최근 1분봉 가공값이
  아직 그 사건에 반응하지 않은 상태인지를 0~100 점으로 매기라. 사건이 아니거나, 이미 알려진 일이거나, 이미 반응했으면 낮게.
answer: {type: score, min: 0, max: 100}
model: {provider: fake, name: claude-opus-5-5, effort: low, max_tokens: 2000, retries: 0}
use:
  - {kind: notify, if: {score_gte: 70}}
  # 예시(주석) — 점수가 높을 때 그 종목에 모의 진입 신호를 내려면 아래 줄의 # 을 지운다. 쓸지는 쓰는 사람이 정한다.
  #   바깥 규칙으로만 파는 진입(exit_by: signal)이라 보유 시간 상한(max_hold_min)을 반드시 적는다. 금액은 설정 금액을 넘지 못한다.
  # - {kind: signal, if: {score_gte: 70}, action: entry, codes: trigger, amount: 1000000, exit_by: signal, max_hold_min: 30, ttl_s: 120}
limits: {daily_calls: 40}
fake:
  answers:
    - '{"score": 82, "reason": "가짜 응답(시험용)"}'
    - '{"score": 20, "reason": "가짜 응답(시험용)"}'
