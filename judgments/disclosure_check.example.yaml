# 공시 판단 견본 — 실행기 종목마다 오늘 새 공시 목록(OpenDART)을 보고 '새 진입을 피할 사건'에 해당하는지 고른다.
# 기본 스위치 그대로 돈다(공시 목록은 공공누리 제1유형 — 출처 표시를 붙여 보냄 · 시세 원값과 뉴스 제목은 쓰지 않음).
# 쓰임: 해당하면 그 종목만 새 진입을 막는 거르기(오늘 장 끝 무렵 만료) + 알림. 청산은 막지 않는다.
# 쓰는 법: disclosure_check.yaml 로 복사해 고친다. OpenDART 키(설정 폴더의 opendart.yaml)가 있어야 공시를 조회한다.
id: disclosure_check
enabled: true
mode: paper_only
per_code: true                   # 종목마다 따로 묻는다(방아쇠 종목 = 그 종목)
when:
  - {at: "08:50"}
  - {every_min: 10, from: "09:00", until: "15:20"}
inputs:
  - {kind: disclosures, codes: trigger, only_new: true, skip_if_empty: true}   # 새 공시가 없으면 묻지 않는다(호출 · 비용 0)
question: |
  위 공시 목록에 다음과 같은 사건이 있는지 보라: 유상증자 · 무상감자 · 유상감자 · 매매거래정지 · 관리종목 지정 · 상장폐지 사유 발생 ·
  불성실공시법인 지정 · 전환사채(CB) · 신주인수권부사채(BW) 발행 결정 · 회생절차 개시 신청.
  하나라도 있으면 avoid, 없으면 none. 공시 제목만으로 알 수 없으면 none.
answer: {type: choice, options: [avoid, none]}
model: {provider: fake, name: claude-opus-5-5, effort: low, max_tokens: 2000, retries: 0}
use:
  - {kind: gate, if: {answer: avoid}, ttl_min: 420, codes: trigger}   # 그 종목만 · 7시간 뒤 만료
  - {kind: notify, if: {answer: avoid}}
limits: {daily_calls: 60}
fake:
  answers:
    - '{"answer": "avoid", "reason": "가짜 응답(시험용): 유상증자 결정 공시"}'
    - '{"answer": "none", "reason": "가짜 응답(시험용)"}'
