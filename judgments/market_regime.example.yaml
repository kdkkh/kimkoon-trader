# 시황 판단 견본 — 지금 시장 분위기를 세 보기 중 하나로 분류한다.
# 쓰임: 'risk_off' 이면 새 진입을 잠시 막는 거르기(만료가 있어 판단이 멈추면 저절로 풀림) + 알림.
# 매수 · 매도를 정하는 판단이 아니다. 거르기를 쓸지 · 어떤 보기를 둘지는 쓰는 사람이 정한다.
# 쓰는 법: 이 파일을 market_regime.yaml 로 복사해 고친다(견본 *.example.yaml 은 --examples 깃발을 줄 때만 읽힌다).
id: market_regime
enabled: true
mode: paper_only                 # 모의 전용 — 다른 값은 거부된다
# target: both                   # 없으면 '지금 문을 켜고 돌고 있는 실행기 모두'(모의 · 시뮬레이션)
when:
  - {at: "08:55"}                # 장 시작 전 한 번(그 시각부터 15분 안에만)
  - {every_min: 30, from: "09:00", until: "15:00"}
inputs:
  - {kind: bars, last: 30, form: derived}          # 실행기가 내놓은 1분봉의 가공값(등락률 · 평균 대비 % · 거래량 배수) — 원 단위 가격은 보내지 않음
  - {kind: news_titles, last: 40, optional: true}  # judge.yaml send.news_titles 를 켜야 들어간다(기본 꺼짐 — 꺼져 있으면 이 입력만 빼고 물음)
question: |
  위 자료(실행기 종목들의 최근 1분봉 가공값, 들어 있으면 뉴스 제목)만 보고 지금 국내 주식시장 분위기를 세 보기 중 하나로 분류하라.
  risk_on = 전반적으로 오르는 쪽 · 위험 선호가 뚜렷함. neutral = 뚜렷하지 않음. risk_off = 전반적으로 내리는 쪽 · 위험 회피가 뚜렷함.
  자료가 적거나 엇갈려 판단할 수 없으면 neutral.
answer: {type: choice, options: [risk_on, neutral, risk_off]}
model: {provider: fake, name: claude-opus-5-5, effort: low, max_tokens: 2000, retries: 0}   # 키를 넣은 뒤 provider: anthropic
use:
  - {kind: gate, if: {answer: risk_off}, ttl_min: 35}   # 만료를 다음 판단(30분)보다 조금 길게
  - {kind: notify, if: {answer: risk_off}}
limits: {daily_calls: 20}
fake:
  answers:
    - '{"answer": "risk_off", "reason": "가짜 응답(시험용)"}'
    - '{"answer": "neutral", "reason": "가짜 응답(시험용)"}'
