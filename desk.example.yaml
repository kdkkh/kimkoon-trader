# 통합 화면 설정 예시 — 복사해서 desk.yaml 로 쓰세요(desk.yaml 이 없으면 이 파일을 읽습니다).
# 실행: python -X utf8 scripts/desk.py  →  http://127.0.0.1:8790/  (녹화 틀 ?rec=1 · 가림 ?mask=1)
# 키 · 계좌 · 토큰은 여기에 넣지 않습니다.

port: 8790

# 탭 줄에 놓을 탭(순서대로). 탭 하나 = desk/tabs/<이름>/ 폴더 하나. 줄을 지우거나 폴더를 지우면 그 탭만 빠집니다.
tabs:
  - trade        # 매매: 실행기 상태(모의 · 간단 시뮬레이션) · 켜기/끄기 · 하루 요약 · 설정 바꾸기 · 사건 흐름
  - backtest     # 백테스트: 지난 결과(봉 재생 · 봉 백테스트) · 봉 백테스트 · 대조 검증기 실행
  - ai           # AI 판단: 판단 목록 · 상태 · 자료 스위치 · 지금 걸린 거르기 · 판단 기록 · 한 번 묻기
  - disclosure   # 공시: 내 OpenDART 키로 오늘 공시 목록(단추식)
  - news         # 뉴스: 내 한투 키(실전 · 조회만)로 뉴스 제목(단추식, 저장하지 않음)

# 받아 둔 자료 경로 칸 — 이 판에는 그 칸을 쓰는 탭 조각이 없습니다(비워 둡니다).
paths: {}

# 받아 둔 자료 쪽 스크립트를 돌릴 파이썬(이 판에서는 쓰지 않음).
system_python: ""

# 매매 탭 손익의 둘째 줄(수수료 · 세금 넣은 값)에 쓰는 율(%). 칸을 비우면 "율을 설정하면 계산"으로 보입니다.
#   쓰는 증권사 수수료 · 그해 세율을 직접 확인해 넣으세요. 예: commission_pct: 0.015 · sell_tax_pct: 0.20 (예시 숫자 — 계좌 종류 · 해마다 다릅니다)
fees: {}
