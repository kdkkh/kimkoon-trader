# 거래소(유가증권 · 코스닥) 휴장일 표 — 거래소 휴장일 공지를 사람이 손으로 옮긴다(해마다 한 번).
# 봇 · 화면의 '켜기'가 이 표를 본다(증권사 API 를 부르지 않게). 토 · 일은 표와 상관없이 휴장으로 본다.
# 표에 없는 해는 '모름'으로 답하고 켜기를 막지 않는다(막지 않되 답에 '모름'을 적는다).
#
# 채우는 법
#   source  : 옮긴 원문(공지 제목과 주소) — 원문을 직접 확인한 뒤에만 채운다
#   checked : 원문을 확인한 날짜(YYYY-MM-DD)
#   years   : 해(따옴표 문자열) → 그해 평일 휴장일 목록(YYYY-MM-DD, 따옴표 문자열)
#   예)
#     years:
#       "2099": ["2099-01-01", "2099-12-31"]
#   임시 휴장일이 새로 공지되면 그해 목록에 더하고 checked 를 고친다.
#
# 지금 든 표(2026 · 2027) — 2026-11-23 에 아래 한국거래소 휴장일 화면을 브라우저로 열어 '한국거래소'로 두 해를 조회하고,
#   보이는 표를 손으로 옮겼다(토 · 일은 표에 없음).
#   한국거래소 휴장일 화면: open.krx.co.kr 의 contents / MKD / 01 / 0110 / 01100305 / MKD01100305.jsp
#     · 영문 global.krx.co.kr 의 contents / GLB / 05 / 0501 / 0501110000 / GLB0501110000.jsp
#     (주소는 사이를 띄워 적었다 — 붙여서 열면 된다. 날짜 표는 화면이 열린 뒤 불러오는 방식이라 브라우저로 열어야 보인다)
#   2027 은 미리 올라와 있던 표라 임시 공휴일이 생기면 달라질 수 있다.
#   해마다 직접 확인한다: 해가 바뀔 때 · 임시 휴장이 공지될 때 위 화면을 다시 열어 표를 고치고 checked 를 적는다.
#   옮겨 적은 표라 틀릴 수 있다 — 이 표만 믿지 말고 거래소 공지를 직접 확인한다.

