# AI 판단 전역 설정 견본 — judge.yaml 로 복사해 고친다. judge.yaml 이 없으면 아래와 같은 기본값으로 돈다.
# 모르는 칸이 있으면 판단 프로세스가 시작하지 않는다(오타 난 스위치가 조용히 무시되지 않게).
# AI 판단은 주문하지 않는다. 정해 둔 보기 · 점수만 답하고, 쓰임(거르기 · 신호 · 설정 내리기 · 알림)은 쓰는 사람이 정한다.

ai_enabled: false        # AI 로 보내는 기능 전체(공급자 anthropic). 가짜 공급자(fake)는 이 스위치와 상관없이 돈다.
ack: false               # 고지를 읽었다는 표시. ai_enabled: true 인데 이것이 없으면 고지만 출력하고 부르지 않는다.
                         #   고지: 자료는 쓰는 사람의 Anthropic 계정으로 전송된다 · 이 프로그램을 만든 사람은 자료를 받지 않는다 ·
                         #   답은 'AI 판단'이며 직접 확인한다.

send:                    # 자료 묶음마다 'AI 로 보냄' 스위치. 가짜 공급자에도 똑같이 적용한다(실제와 같은 길로 시험).
  bars_raw: false        # 1분봉 원값(원 단위 가격 · 거래량) · 신호의 지표 값 · 평균가. 꺼 두면 가공값(등락률 · 평균 대비 % · 거래량 배수)만
                         #   까닭: 증권사 시세 약관은 '개인의 업무에 한하여 · 제3자 제공 금지'를 둔다 — AI 회사 서버가 제3자인지 약관에 정의가 없다
  news_titles: false     # 한투 뉴스 제목(제목만, 본문 없음). 원공급사의 저장 · 배포 조건이 따로 있다 — 확인한 뒤 켠다
  disclosures: true      # OpenDART 공시 목록(출처 '금융감독원 전자공시(OpenDART)'를 붙여 보냄 — 공공누리 제1유형)
  signals: true          # 실행기의 전략 신호(시각 · 종목 · 신호 이름)
  positions: true        # 실행기 상태(보유 종목 · 수량 · 오늘 진입 수)
  text: true             # 봇 · 화면이 넘긴 글
  browser: false         # 웹 페이지에서 읽은 값 — 이 판에는 브라우저 읽기 모듈이 없다(켜도 읽을 자료가 없음)

record_titles: false     # 판단 기록에 뉴스 제목 원문을 남길지. 꺼짐 = 일련번호 · 시각 · 해시만(프롬프트 전문도 그 자리만 가림)

limits:                  # 전역 상한 — 넘으면 그날 멈추고 알림 한 번(다음 날 다시 돈다)
  daily_calls: 200       # 하루 호출 수(재시도 포함, 가짜 공급자도 센다)
  daily_usd: 1.0         # 하루 비용 어림(달러, 아래 단가표로 계산). 표에 없는 모델은 '비용 어림 없음' — 그 호출에는 호출 수 상한만 걸린다

news: {poll_s: 60, limit: 40}     # 새 제목 방아쇠(on: new_news)의 조회 간격(초) · 한 번에 볼 건수
opendart: {daily_cap: 500}         # 이 프로그램의 OpenDART 하루 호출 몫(개인 키 한도를 다른 프로그램과 나눠 쓸 때 낮춘다)

prices:                  # 단가표(100만 토큰당 달러). 코드에 박지 않는다 — 바뀌면 여기만 고친다.
  checked: "2026-11-23"
  source: "Anthropic 모델 단가표(이 날짜에 옮겨 적음). 쓰기 전에 Anthropic 공식 가격 안내로 다시 확인하세요"
  unit: usd_per_million_tokens
  models:
    claude-opus-5-5: {input: 4.00, output: 20.00, cache_read: 0.20}
    claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.10}
    claude-haiku-5-5: {input: 0.10, output: 0.50, note: "프롬프트 10만 토큰까지의 단가(넘으면 0.50 / 2.50)"}
    # 캐시 쓰기 단가(cache_write)는 비워 둠 — 이 틀은 프롬프트 캐시를 쓰지 않는다
