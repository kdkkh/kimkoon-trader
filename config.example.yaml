# 매매 환경 설정 예시 — 복사해서 config.yaml 로 쓰세요(config.yaml 이 있으면 실행기가 읽습니다).
# 매매 규칙 · 설정 · 결과는 쓰는 사람의 몫입니다. 아래 숫자는 형식을 보여 주는 예시이며 권하는 값이 아닙니다.
# 명령줄 옵션을 주면 그 값이 이 파일보다 우선합니다. 실행 중에 이 파일을 고치면 1분(봉) 안에 검사 뒤 적용합니다
#   (잘못된 값이면 적용하지 않고 기존대로 계속 · tf · start · until · lookback · max_amount 는 다시 시작해야 반영).
# 키 · 계좌는 여기에 넣지 않습니다(설정 폴더의 kis_devlp.yaml — README 의 '키 파일').

codes: []                    # 종목 코드(6자리, 따옴표로). 예: ["<종목코드>", "<종목코드>"] — 기본값은 없습니다
strategy: supertrend         # strategy/ported/ 의 전략 이름
params: {}                   # 전략 값 바꾸기 예: {atrPeriod: 10, factor: 3.0}
tf: 1                        # 봉(분)

order_mode: limit            # 주문 방식 — 이 판에는 둘만 있습니다(실행 중에 바꾸면 다음 새 주문부터)
                             #   limit   현재가를 호가 단위로 맞춘 가격으로 수량을 정함
                             #   market  시장가(수량은 현재가 + 1호가 기준이라 조금 적게 잡힘)
                             #   간단 시뮬레이션은 둘 다 신호 순간 현재가로 바로 체결된 것으로 적고,
                             #   모의투자 연결은 둘 다 시장가로 보낸 뒤 체결 조회로 확인합니다(oms/simple.py).
apply_to_open: false         # 이 판에는 걸어 두는 주문이 없어 쓰이지 않습니다(칸만 같게 둠)
amount: 1000000              # 금액 기준 수량: 1회 매수 금액(원, max_amount 이하)
max_amount: 1000000          # 1회 금액 상한(원, 3,000,000 이하) — 시작할 때만 읽음. amount 가 넘으면 시작하지 않음
wait: 50                     # 지정가 기다림(초) — 이 판에서는 쓰이지 않습니다(칸만 같게 둠, 0 보다 커야 함)
max_orders: 5                # 하루 새 진입(매수) 상한 — 청산은 세지 않음
loss_limit: 30000            # 일 손실 한도(원, 실현 + 평가) — 닿으면 그날 새 진입 중단

start: "09:00"
until: "15:20"
poll: 2                      # 확인 중인 주문을 다시 볼 간격(초)
settle: 3                    # 봉 마감 뒤 기다릴 초
lookback: 120                # 처음 받을 1분봉 수(지표 예열)
