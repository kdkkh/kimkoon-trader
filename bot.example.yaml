# 텔레그램 봇 설정 견본 — bot.yaml 로 복사해 고친다(없으면 아래 기본값). 봇 토큰 · 내 id 는 여기가 아니라
# 설정 폴더의 telegram.yaml(bot_token · owner_id)에 둔다(README 의 '키 파일').
# 아래 숫자는 형식을 보여 주는 기본값이며 권하는 값이 아니다. 매매 규칙 · 금액은 쓰는 사람이 정한다.

trade_enabled: false     # true 면 /사기 · /팔기 를 받는다(확인 번호 뒤 문에 신호를 쓴다 — 봇은 주문 함수를 부르지 않는다)
trade_target: paper      # 신호를 쓸 문: paper = 모의투자 연결(state/ext/) · sim = 간단 시뮬레이션(state/sim/ext/)
buy_hold_min: 30         # 사기 신호의 보유 시간(분) — 지나면 실행기가 판다(바깥이 산 것은 보유 시간이 꼭 있어야 한다)
buy_stop_pct: 2.0        # 사기 신호의 손절(%)
signal_expires_s: 120    # 신호 유효 시간(초) — 실행기가 그 안에 읽지 못하면 버린다
sim_notify: false        # true 면 간단 시뮬레이션 기록을 따라 읽어 '[시뮬]' 머리로 알림
confirm_s: 60            # 확인 번호 유효 시간(초)
